name: CI/CD - DonationAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: hackatonfiap-donations

# Princípio do menor privilégio: o token só precisa ler o repo para checkout/build.
permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore HackatonFiap.Donations.sln
      - run: dotnet build HackatonFiap.Donations.sln --no-restore -c Release
      - run: dotnet test HackatonFiap.Donations.sln --no-build -c Release --verbosity minimal
      # RT5: build da imagem roda SEMPRE (sem secrets); push/deploy é o job cd.
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

  cd:
    name: Deploy to AKS (opcional)
    runs-on: ubuntu-latest
    needs: ci
    # Gated: só em push na main com a variável DEPLOY_TO_AKS=true.
    # Mantém a CI verde sem infra/secrets Azure (padrão RT5, igual ao repo users).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_AKS == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR via Docker
        run: |
          docker login ${{ secrets.ACR_NAME }}.azurecr.io \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      - name: Build & push image (docker no runner; NAO az acr build — ACR Tasks e bloqueado no Free Trial)
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # O Deployment é criado pelo Helm (deploy-apps.ps1); aqui só rolamos a nova imagem.
      - name: Rolling deploy
        run: |
          kubectl set image deployment/hackatonfiap-donations \
            hackatonfiap-donations=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n conexao-solidaria
          kubectl rollout status deployment/hackatonfiap-donations -n conexao-solidaria --timeout=120s
