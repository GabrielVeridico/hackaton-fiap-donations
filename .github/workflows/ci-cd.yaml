name: CI/CD - DonationAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: hackatonfiap-donations

# Princípio do menor privilégio: o token só precisa ler o repo para checkout/build.
permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore HackatonFiap.Donations.sln
      - run: dotnet build HackatonFiap.Donations.sln --no-restore -c Release
      - run: dotnet test HackatonFiap.Donations.sln --no-build -c Release --verbosity minimal
      # RT5: build da imagem roda SEMPRE (sem secrets); push/deploy é o job cd.
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

  cd:
    name: Deploy to AKS (opcional)
    runs-on: ubuntu-latest
    needs: ci
    # Gated: push na main ou disparo manual, e só com a variável DEPLOY_TO_AKS=true.
    # Mantém a CI verde sem infra/secrets Azure (padrão RT5, igual ao repo users).
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_TO_AKS == 'true'
    permissions:
      id-token: write # obrigatório para o OIDC do azure/login
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Autenticação federada (OIDC): nenhuma senha de longa duração fica guardada no repositório.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # az acr login reaproveita o token do OIDC — dispensa ACR_USERNAME/ACR_PASSWORD.
      - name: Login no ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & push da imagem (docker no runner; NAO az acr build — ACR Tasks e bloqueado no Free Trial)
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Credenciais do AKS
        run: az aks get-credentials -g ${{ secrets.RESOURCE_GROUP }} -n ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      # O Deployment é criado pelo Helm (deploy-apps.ps1); aqui só rolamos a nova imagem.
      - name: Rolling deploy
        run: |
          kubectl set image deployment/hackatonfiap-donations \
            hackatonfiap-donations=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n conexao-solidaria
          kubectl rollout status deployment/hackatonfiap-donations -n conexao-solidaria --timeout=180s
